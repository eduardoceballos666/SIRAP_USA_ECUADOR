# Publica FastAPI + Vue y sincroniza el notebook SIRAP_backend en Hugging Face.
# En SIRAP_USA_ECUADOR se ejecuta solo manualmente para evitar publicar por accidente
# sobre el Space configurado en el repositorio original.
name: Deploy a Hugging Face Spaces

on:
  workflow_dispatch:

concurrency: { group: hf-space, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "huggingface_hub>=0.25"
      - name: Subir al Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: eduardoceballos/SIRAP_USA_ECUADOR_HF
          SIRAP_JWT_SECRET: ${{ secrets.SIRAP_JWT_SECRET }}
          SIRAP_DEMO_PASSWORD: ${{ secrets.SIRAP_DEMO_PASSWORD }}
          SIRAP_DATA_GITHUB_TOKEN: ${{ secrets.SIRAP_DATA_GITHUB_TOKEN }}
          SIRAP_DATA_GITHUB_REPO: eduardoceballos666/SIRAP_datos_privados
        run: python deploy/huggingface/sync_space.py
