name: Importar SIRAP_2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-sirap-2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-sirap-2
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio destino
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Instalar Git LFS
        run: git lfs install

      - name: Descargar SIRAP_2
        run: |
          git clone --depth 1 https://github.com/eduardoceballos666/SIRAP_2.git /tmp/SIRAP_2
          git -C /tmp/SIRAP_2 lfs pull

      - name: Copiar todos los archivos
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/workflows/import-sirap-2.yml' \
            /tmp/SIRAP_2/ ./

      - name: Guardar la copia en main
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "El repositorio ya coincide con SIRAP_2."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Copiar contenido de SIRAP_2"
          git push origin HEAD:main
